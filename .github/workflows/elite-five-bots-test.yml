name: Elite five-bot report tests

on:
  pull_request:
    branches: [main]
    paths:
      - "elite-five-bots.js"
      - "elite-five-bots.test.js"
      - "server.js"
      - ".github/workflows/elite-five-bots-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check server.js
      - run: node --test elite-five-bots.test.js
