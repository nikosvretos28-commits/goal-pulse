name: GoalMatrix settlement checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check server.js
      - name: Check settlement helper syntax
        run: node --check settlement.js
      - name: Run all Node tests
        run: npm test
