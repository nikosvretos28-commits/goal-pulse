name: Publish Goal Pulse container

on:
  push:
    branches:
      - main
      - fix/dirty-sheet-team-matching
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nikosvretos28-commits/goal-pulse-analytics:latest
            ghcr.io/nikosvretos28-commits/goal-pulse-analytics:${{ github.sha }}
