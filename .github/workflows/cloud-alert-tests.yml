name: Cloud Alert isolated tests
on:
  pull_request:
    branches: [main]
    paths:
      - "cloud-alert-evaluator.js"
      - "cloud-alert-evaluator.test.js"
      - ".github/workflows/cloud-alert-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-alert-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Run isolated Cloud Alert tests
        run: node --test cloud-alert-evaluator.test.js
