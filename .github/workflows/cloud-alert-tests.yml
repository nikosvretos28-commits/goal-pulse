name: Cloud Alert isolated tests
on:
  pull_request:
    branches: [main]
    paths:
      - "cloud-alert-evaluator.js"
      - "cloud-alert-evaluator.test.js"
      - "cloud-alert-scanner.js"
      - "cloud-alert-scanner.test.js"
      - "cloud-alert-runtime.js"
      - "cloud-alert-runtime.test.js"
      - "cloud-alert-settlement.js"
      - "cloud-alert-settlement.test.js"
      - "cloud-alert-postgres.integration.test.js"
      - "server.js"
      - "docs/CLOUD_ALERT_IMPLEMENTATION_PLAN.md"
      - ".github/workflows/cloud-alert-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-alert-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloud_alert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cloud_alert_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLOUD_ALERT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cloud_alert_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install PostgreSQL test client
        run: npm install --no-save --package-lock=false pg@8.13.1
      - name: Run isolated Cloud Alert tests and PostgreSQL integration
        run: node --test cloud-alert-evaluator.test.js cloud-alert-scanner.test.js cloud-alert-runtime.test.js cloud-alert-settlement.test.js cloud-alert-postgres.integration.test.js
