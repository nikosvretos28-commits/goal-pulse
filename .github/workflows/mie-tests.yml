name: MIE offline tests

on:
  pull_request:
    paths:
      - "research/mie_tools/**"
      - ".github/workflows/mie-tests.yml"
  push:
    branches:
      - "research/goalmatrix-mathematical-intelligence-engine"
    paths:
      - "research/mie_tools/**"
      - ".github/workflows/mie-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run MIE unit and integration tests
        working-directory: research/mie_tools
        run: python -m unittest -v
