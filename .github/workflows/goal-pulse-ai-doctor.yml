name: Goal Pulse AI Doctor

on:
  push:
    branches: [main, feature/goal-pulse-ai-doctor]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-doctor:
    name: Read-only diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Goal Pulse AI Doctor
        run: npm run doctor
